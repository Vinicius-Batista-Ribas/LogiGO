version: "3.9"

services:
  backend:
    build: ./cmd
    container_name: go-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
     - postgres
    env_file:
     - ./cmd/.env
    networks:
      - backend-network
      
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: Go@inatel.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "54321:80"
    depends_on:
      - postgres
    networks:
      - backend-network

volumes:
  postgres-data:

networks:
  backend-network:
    driver: bridge



 
